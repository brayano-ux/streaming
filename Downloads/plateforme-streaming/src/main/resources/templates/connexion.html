<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion - StreamPerso</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="conteneur-auth">
        <h1>Connexion</h1>

        <p class="message-erreur" th:if="${param.erreur}">Email, mot de passe incorrect, ou compte non active.</p>
        <p class="message-info" th:if="${param.active}">Compte active ! Vous pouvez vous connecter.</p>
        <p class="message-info" th:if="${param.deconnexion}">Vous avez ete deconnecte.</p>

        <form method="post" th:action="@{/api/auth/connexion}">
            <div class="champ">
                <label for="username">Email</label>
                <input type="email" id="username" name="username" required>
            </div>
            <div class="champ">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="bouton">Se connecter</button>
        </form>

        <div class="separateur">ou</div>

        <a th:href="@{/api/auth/connexion-google/google}" class="bouton-google">Continuer avec Google</a>

        <a th:href="@{/inscription}" class="lien-secondaire">Pas encore de compte ? S'inscrire</a>
    </div>
</body>
</html>
