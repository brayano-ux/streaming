<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscription - StreamPerso</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="conteneur-auth">
        <h1>Creer un compte</h1>

        <p class="message-erreur" th:if="${erreur}" th:text="${erreur}"></p>

        <form method="post" th:action="@{/inscription}" th:object="${inscriptionForm}">
            <div class="champ">
                <label for="nom">Nom</label>
                <input type="text" id="nom" th:field="*{nom}" required>
                <p class="message-erreur" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></p>
            </div>
            <div class="champ">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" required>
                <p class="message-erreur" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>
            <div class="champ">
                <label for="motDePasse">Mot de passe</label>
                <input type="password" id="motDePasse" th:field="*{motDePasse}" required>
                <p class="message-erreur" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></p>
            </div>
            <button type="submit" class="bouton">S'inscrire</button>
        </form>

        <div class="separateur">ou</div>
        <a th:href="@{/api/auth/connexion-google/google}" class="bouton-google">S'inscrire avec Google</a>

        <a th:href="@{/connexion}" class="lien-secondaire">Deja un compte ? Se connecter</a>
    </div>
</body>
</html>
