<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

  <!-- En-tête -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-6 border-b border-slate-200/80">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">Nouvel élève</h1>
      <p class="mt-1 text-sm text-slate-500">Renseignez les informations personnelles et les coordonnées des responsables.</p>
    </div>
    <button type="button"
            (click)="annuler()"
            class="inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-semibold text-slate-700 bg-white hover:bg-slate-50 border border-slate-300 rounded-lg shadow-sm transition-colors">
      <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
      Retour à la liste
    </button>
  </div>

  <!-- Formulaire -->
  <form [formGroup]="eleveForm" (ngSubmit)="onSubmit()" novalidate class="bg-white rounded-xl shadow-sm border border-slate-200/80 overflow-hidden">

    <div class="p-6 sm:p-8 space-y-6">

      <!-- Section: Informations Personnelles -->
      <div>
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">Informations de l'élève</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

          <!-- Nom -->
          <div>
            <label for="nom" class="block text-sm font-medium text-slate-700 mb-1.5">Nom <span class="text-red-500">*</span></label>
            <input id="nom"
                   type="text"
                   formControlName="nom"
                   placeholder="ex: Mbala"
                   class="w-full px-3.5 py-2 text-sm text-slate-900 bg-white border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors" />
          </div>

          <!-- Prénom -->
          <div>
            <label for="prenom" class="block text-sm font-medium text-slate-700 mb-1.5">Prénom <span class="text-red-500">*</span></label>
            <input id="prenom"
                   type="text"
                   formControlName="prenom"
                   placeholder="ex: Jean-Marc"
                   class="w-full px-3.5 py-2 text-sm text-slate-900 bg-white border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors" />
          </div>

          <!-- Matricule -->
          <div>
            <label for="matricule" class="block text-sm font-medium text-slate-700 mb-1.5">Matricule</label>
            <input id="matricule"
                   type="text"
                   formControlName="matricule"
                   placeholder="ex: CSBC-25-0147"
                   class="w-full px-3.5 py-2 text-sm text-slate-900 bg-white border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 font-mono transition-colors" />
          </div>

          <!-- Sexe -->
          <div>
            <label for="sexe" class="block text-sm font-medium text-slate-700 mb-1.5">Sexe <span class="text-red-500">*</span></label>
            <select id="sexe"
                    formControlName="sexe"
                    class="w-full px-3.5 py-2 text-sm text-slate-900 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
              <option value="M">Masculin</option>
              <option value="F">Féminin</option>
            </select>
          </div>

          <!-- Date de naissance -->
          <div>
            <label for="dateNaissance" class="block text-sm font-medium text-slate-700 mb-1.5">Date de naissance</label>
            <input id="dateNaissance"
                   type="date"
                   formControlName="dateNaissance"
                   class="w-full px-3.5 py-2 text-sm text-slate-900 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors" />
          </div>

          <!-- Lieu de naissance -->
          <div>
            <label for="lieuNaissance" class="block text-sm font-medium text-slate-700 mb-1.5">Lieu de naissance</label>
            <input id="lieuNaissance"
                   type="text"
                   formControlName="lieuNaissance"
                   placeholder="ex: Douala"
                   class="w-full px-3.5 py-2 text-sm text-slate-900 bg-white border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors" />
          </div>

        </div>
      </div>

      <hr class="border-slate-200/80" />

      <!-- Section: Informations du Tuteur / Parent -->
      <div>
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">Responsable Légal</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

          <!-- Nom du parent -->
          <div>
            <label for="nomParent" class="block text-sm font-medium text-slate-700 mb-1.5">Nom du parent / tuteur</label>
            <input id="nomParent"
                   type="text"
                   formControlName="nomParent"
                   placeholder="ex: Mbala Pierre"
                   class="w-full px-3.5 py-2 text-sm text-slate-900 bg-white border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors" />
          </div>

          <!-- Téléphone du parent -->
          <div>
            <label for="telephoneParent" class="block text-sm font-medium text-slate-700 mb-1.5">Téléphone du parent</label>
            <input id="telephoneParent"
                   type="tel"
                   formControlName="telephoneParent"
                   placeholder="ex: +237 6xx xx xx xx"
                   class="w-full px-3.5 py-2 text-sm text-slate-900 bg-white border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors" />
          </div>

        </div>
      </div>

      <!-- Erreur d'enregistrement -->
      @if (errorMessage) {
      <div class="p-4 rounded-xl bg-red-50/80 border border-red-200 flex items-start gap-3.5">
        <div class="p-1 bg-red-100 rounded-full text-red-600 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-red-900">Échec de l'enregistrement</h3>
          <p class="mt-0.5 text-sm text-red-700">{{ errorMessage }}</p>
        </div>
      </div>
      }

    </div>

    <!-- Actions du Formulaire (Pied de carte) -->
    <div class="px-6 py-4 bg-slate-50/70 border-t border-slate-200/80 flex items-center justify-end gap-3">
      <button type="button"
              (click)="annuler()"
              class="px-4 py-2.5 text-sm font-semibold text-slate-700 bg-white hover:bg-slate-100 border border-slate-300 rounded-lg shadow-sm transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-500">
        Annuler
      </button>

      <button type="submit"
              [disabled]="eleveForm.invalid || loading"
              class="inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:bg-indigo-300 disabled:cursor-not-allowed rounded-lg shadow-sm transition-all duration-150 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
        @if (loading) {
        <svg class="w-4 h-4 text-white animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Enregistrement...</span>
        } @else {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span>Enregistrer l'élève</span>
        }
      </button>
    </div>

  </form>
</div>
