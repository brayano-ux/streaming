<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6 bg-slate-50/50 min-h-screen">

  <!-- Fil d'Ariane & En-tête -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <a (click)="annuler()"
         class="inline-flex items-center gap-2 text-sm font-medium text-slate-500 hover:text-indigo-600 transition-colors cursor-pointer mb-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Retour aux classes
      </a>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Nouvelle classe</h1>
      <p class="text-sm text-slate-500">Ajoutez une nouvelle classe au catalogue de votre établissement.</p>
    </div>
  </div>

  <!-- Formulaire Principal -->
  <form [formGroup]="classeForm" (ngSubmit)="onSubmit()" novalidate class="space-y-6">

    <!-- Carte Formulaire -->
    <div class="bg-white rounded-2xl border border-slate-200/80 p-6 md:p-8 shadow-sm space-y-6">

      <!-- En-tête de Section -->
      <div class="flex items-center gap-3 pb-4 border-b border-slate-100">
        <div class="w-9 h-9 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0v-4m0 4h4"/>
          </svg>
        </div>
        <div>
          <h2 class="text-base font-bold text-slate-900">Informations de la Classe</h2>
          <p class="text-xs text-slate-500">Définissez le nom court et le niveau d'enseignement</p>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

        <!-- Nom de la classe -->
        <div class="space-y-2">
          <label for="nom" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
            Nom de la classe <span class="text-rose-500">*</span>
          </label>
          <input id="nom"
                 type="text"
                 formControlName="nom"
                 placeholder="ex: 6ème A"
                 class="w-full px-3.5 py-2.5 text-sm font-semibold text-slate-900 bg-white rounded-xl border border-slate-200 shadow-sm transition-all duration-150 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 placeholder:text-slate-400 placeholder:font-normal" />
        </div>

        <!-- Niveau -->
        <div class="space-y-2">
          <label for="niveau" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
            Niveau <span class="text-rose-500">*</span>
          </label>
          <input id="niveau"
                 type="text"
                 formControlName="niveau"
                 placeholder="ex: 6ème"
                 class="w-full px-3.5 py-2.5 text-sm font-medium text-slate-900 bg-white rounded-xl border border-slate-200 shadow-sm transition-all duration-150 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 placeholder:text-slate-400 placeholder:font-normal" />
        </div>

      </div>
    </div>

    <!-- Message d'Erreur -->
    @if (errorMessage) {
    <div class="p-4 rounded-xl bg-rose-50 border border-rose-200/80 flex items-center gap-3 text-rose-800" role="alert">
      <svg class="w-5 h-5 text-rose-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
      <span class="text-sm font-medium">{{ errorMessage }}</span>
    </div>
    }

    <!-- Boutons d'Action -->
    <div class="flex items-center justify-end gap-3 pt-2">
      <button type="button"
              (click)="annuler()"
              class="px-5 py-2.5 text-sm font-semibold text-slate-700 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl shadow-sm transition-all duration-150 cursor-pointer">
        Annuler
      </button>

      <button type="submit"
              [disabled]="classeForm.invalid || loading"
              class="inline-flex items-center justify-center gap-2 px-6 py-2.5 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:bg-slate-300 disabled:cursor-not-allowed rounded-xl shadow-sm shadow-indigo-200 transition-all duration-150 cursor-pointer">
        @if (loading) {
        <svg class="w-4 h-4 text-white animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Enregistrement...
        } @else {
        Créer la classe
        }
      </button>
    </div>

  </form>
</div>
