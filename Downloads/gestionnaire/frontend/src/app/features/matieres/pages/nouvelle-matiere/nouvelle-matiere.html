<form [formGroup]="matiereForm" (ngSubmit)="ajouter()" novalidate
      class="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 space-y-6">

  <!-- Grille pour les champs du formulaire -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">

    <!-- Nom de la matière (Prend 2 colonnes sur écran moyen+) -->
    <div class="sm:col-span-2 space-y-2">
      <label for="nom" class="block text-sm font-medium text-slate-700 dark:text-slate-300">
        Nom de la matière
      </label>
      <input id="nom" type="text" formControlName="nom" placeholder="Ex: Mathématiques"
             class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all" />
    </div>

    <!-- Coefficient (Prend 1 colonne) -->
    <div class="space-y-2">
      <label for="coefficient" class="block text-sm font-medium text-slate-700 dark:text-slate-300">
        Coefficient
      </label>
      <input id="coefficient" type="number" min="1" formControlName="coefficient" placeholder="Ex: 2"
             class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all" />
    </div>

  </div>

  <!-- Pied de formulaire et Bouton de soumission -->
  <div class="flex items-center justify-end pt-4 border-t border-slate-100 dark:border-slate-800">
    <button type="submit" [disabled]="matiereForm.invalid"
            class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 dark:disabled:bg-slate-800 text-white font-medium text-sm rounded-xl shadow-sm shadow-indigo-200 dark:shadow-none transition-all duration-200 hover:shadow-md active:scale-95 disabled:cursor-not-allowed">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      <span>Ajouter la matière</span>
    </button>
  </div>

</form>
