<div class="min-h-screen bg-slate-50/50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">

  <div class="sm:mx-auto sm:w-full sm:max-w-md">

    <!-- Carte de Connexion -->
    <div class="bg-white rounded-2xl border border-slate-200/80 p-8 shadow-sm space-y-6">

      <!-- En-tête -->
      <header class="text-center">
        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl mx-auto flex items-center justify-center mb-4">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Connexion</h1>
        <p class="mt-1.5 text-sm text-slate-500">Accédez à votre espace de gestion</p>
      </header>

      <!-- Formulaire -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate class="space-y-5">

        <!-- Champ Email -->
        <div class="space-y-1.5">
          <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
            Email <span class="text-rose-500">*</span>
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="nom@exemple.com"
            class="w-full px-3.5 py-2.5 text-sm text-slate-900 bg-white rounded-xl border shadow-sm transition-all duration-150 focus:outline-none placeholder:text-slate-400"
            [class.border-rose-300]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            [class.focus:border-rose-500]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            [class.focus:ring-rose-500\/20]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          [class.border-slate-200]="!(loginForm.get('email')?.invalid && loginForm.get('email')?.touched)"
          [class.focus:border-indigo-500]="!(loginForm.get('email')?.invalid && loginForm.get('email')?.touched)"
          [class.focus:ring-indigo-500\/20]="!(loginForm.get('email')?.invalid && loginForm.get('email')?.touched)"
          />

          @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <span class="flex items-center gap-1.5 text-xs text-rose-600 font-medium pt-0.5">
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              Entrez une adresse email valide
            </span>
          }
        </div>

        <!-- Champ Mot de Passe -->
        <div class="space-y-1.5">
          <label for="motDePasse" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
            Mot de passe <span class="text-rose-500">*</span>
          </label>
          <input
            id="motDePasse"
            type="password"
            formControlName="motDePasse"
            autocomplete="current-password"
            placeholder="••••••••"
            class="w-full px-3.5 py-2.5 text-sm text-slate-900 bg-white rounded-xl border shadow-sm transition-all duration-150 focus:outline-none placeholder:text-slate-400"
            [class.border-rose-300]="loginForm.get('motDePasse')?.invalid && loginForm.get('motDePasse')?.touched"
            [class.focus:border-rose-500]="loginForm.get('motDePasse')?.invalid && loginForm.get('motDePasse')?.touched"
            [class.focus:ring-rose-500\/20]="loginForm.get('motDePasse')?.invalid && loginForm.get('motDePasse')?.touched"
          [class.border-slate-200]="!(loginForm.get('motDePasse')?.invalid && loginForm.get('motDePasse')?.touched)"
          [class.focus:border-indigo-500]="!(loginForm.get('motDePasse')?.invalid && loginForm.get('motDePasse')?.touched)"
          [class.focus:ring-indigo-500\/20]="!(loginForm.get('motDePasse')?.invalid && loginForm.get('motDePasse')?.touched)"
          />
        </div>

        <!-- Alerte d'Erreur Générale -->
        @if (errorMessage) {
        <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200/80 flex items-center gap-2.5 text-rose-800" role="alert">
          <svg class="w-4 h-4 text-rose-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span class="text-xs font-semibold">{{ errorMessage }}</span>
        </div>
        }

        <!-- Bouton Soumission -->
        <button
          type="submit"
          class="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:bg-slate-300 disabled:cursor-not-allowed rounded-xl shadow-sm shadow-indigo-200 transition-all duration-150 cursor-pointer pt-3"
          [disabled]="loginForm.invalid || loading"
        >
          @if (loading) {
          <svg class="w-4 h-4 text-white animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Connexion en cours...</span>
          } @else {
          <span>Se connecter</span>
          }
        </button>

      </form>
    </div>

  </div>
</div>
