<div class="min-h-screen bg-slate-50/50 flex flex-col md:flex-row font-sans text-slate-800 antialiased">

  <!-- ==================== SIDEBAR ==================== -->
  <aside
    [class.-translate-x-full]="!sidebarOpen && mobileView"
    [class.translate-x-0]="sidebarOpen || !mobileView"
    class="fixed inset-y-0 left-0 z-50 w-72 md:w-64 bg-white border-r border-slate-200/80 flex flex-col transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0">

    <!-- En-tête / Logo -->
    <div class="h-16 px-6 flex items-center justify-between gap-3 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white font-bold flex items-center justify-center text-sm shadow-sm shadow-indigo-200">
          ÉN
        </div>
        <div>
          <span class="block text-sm font-bold text-slate-900 leading-tight">École Numérique</span>
          <span class="block text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Espace de Gestion</span>
        </div>
      </div>
      <!-- Bouton de fermeture pour mobile -->
      <button (click)="closeSidebar()" class="md:hidden p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Navigation Principale -->
    <nav class="p-4 space-y-1 flex-1 overflow-y-auto">
      @for (item of navItems; track item.path) {
      <a [routerLink]="item.path"
         routerLinkActive="bg-indigo-50/80 text-indigo-600 font-semibold shadow-xs"
         [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
         class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 transition-all duration-150 cursor-pointer group"
         (click)="closeSidebar()">
        <i [class]="item.icon" class="w-5 text-center text-slate-400 group-hover:text-indigo-600 transition-colors duration-150 text-base"></i>
        <span>{{ item.label }}</span>
      </a>
      }
    </nav>

    <!-- Pied de Sidebar -->
    <div class="p-4 border-t border-slate-100 hidden md:block">
      <div class="p-3 bg-slate-50 rounded-xl border border-slate-200/60 text-xs text-slate-500">
        <p class="font-semibold text-slate-700">Plateforme v1.0</p>
        <p class="mt-0.5">Assistance administrative disponible.</p>
      </div>
    </div>

  </aside>

  <!-- Overlay mobile lors de l'ouverture de la sidebar -->
  @if (mobileView && sidebarOpen) {
  <div (click)="closeSidebar()" class="fixed inset-0 z-40 bg-black/20 backdrop-blur-sm md:hidden"></div>
  }

  <!-- ==================== CONTENU PRINCIPAL ==================== -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Header / Topbar -->
    <header class="h-16 bg-white border-b border-slate-200/80 px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4 sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <!-- Bouton hamburger pour mobile -->
        <button (click)="toggleSidebar()" class="md:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-indigo-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>

        <!-- Fil d'Ariane (à remplacer par un composant) -->
        <nav aria-label="Breadcrumb" class="hidden sm:flex items-center gap-1 text-sm text-slate-500">
          <a routerLink="/dashboard" class="hover:text-indigo-600">Tableau de bord</a>
          <span class="text-slate-300">/</span>
          <span class="text-slate-900 font-medium truncate">Page courante</span>
        </nav>
      </div>

      <!-- Actions Header -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Notifications -->
        <button class="relative p-2 text-slate-400 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full ring-2 ring-white"></span>
        </button>

        <!-- Menu utilisateur avec dropdown -->
        @if (user) {
        <div class="relative" (click)="toggleUserMenu()" (clickOutside)="userMenuOpen = false">
          <button class="flex items-center gap-2 p-1.5 sm:p-2 rounded-xl hover:bg-slate-100 transition-colors cursor-pointer">
            <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 font-bold flex items-center justify-center text-xs">
              {{ user.nom?.charAt(0) || 'U' }}
            </div>
            <div class="hidden sm:flex flex-col text-left">
              <span class="text-sm font-bold text-slate-900 leading-none">{{ user.nom }}</span>
              <span class="text-[10px] text-slate-500 font-medium mt-0.5">{{ user.role }}</span>
            </div>
            <svg class="w-4 h-4 text-slate-400 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          @if (userMenuOpen) {
          <div class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-lg border border-slate-200/80 py-1 z-50">
            <a routerLink="/profil" class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 hover:text-indigo-600">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
              Mon profil
            </a>
            <a routerLink="/parametres" class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 hover:text-indigo-600">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              Paramètres
            </a>
            <div class="border-t border-slate-100 my-1"></div>
            <button (click)="logout()" class="flex w-full items-center gap-3 px-4 py-2.5 text-sm text-rose-600 hover:bg-rose-50">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              Déconnexion
            </button>
          </div>
          }
        </div>
        }
      </div>
    </header>

    <!-- Zone de rendu des pages -->
    <main class="flex-1">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
